name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo Version: $VERSION
          sed -Ei "s|^version = \"[0-9.]+\"|version = \"$VERSION\"|" ./app/postgraph/Cargo.toml
          if ! grep -qE "^version = \"$VERSION\"" ./app/postgraph/Cargo.toml; then
            echo "failed to update version in Cargo.toml" >&2
            exit 1
          else
            echo "version updated successfully in Cargo.toml" >&2
          fi

      - name: Build
        run: cargo build --release --package postgraph

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: postgraph-linux
          path: target/release/postgraph
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo Version: $VERSION
          sed -Ei "s|^version = \"[0-9.]+\"|version = \"$VERSION\"|" ./app/postgraph/Cargo.toml
          if ! grep -qE "^version = \"$VERSION\"" ./app/postgraph/Cargo.toml; then
            echo "failed to update version in Cargo.toml" >&2
            exit 1
          else
            echo "version updated successfully in Cargo.toml" >&2
          fi

      - name: Build
        run: cargo build --release --package postgraph

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: postgraph-windows
          path: target/release/postgraph.exe
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    permissions:
      contents: write
    steps:
      - name: Download Linux executable
        uses: actions/download-artifact@v8
        with:
          name: postgraph-linux
          path: release

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: postgraph-windows
          path: release

      - name: Create immutable release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release/postgraph
            release/postgraph.exe
