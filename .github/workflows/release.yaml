name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --package smtp2graph

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: smtp2graph-linux
          path: target/release/smtp2graph
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --package smtp2graph

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: smtp2graph-windows
          path: target/release/smtp2graph.exe
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    permissions:
      contents: write
    steps:
      - name: Download Linux executable
        uses: actions/download-artifact@v8
        with:
          name: smtp2graph-linux
          path: release

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: smtp2graph-windows
          path: release

      - name: Create immutable release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release/smtp2graph
            release/smtp2graph.exe
